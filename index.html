<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSRD — Games by The Silent Bard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a1410;
      --ink:     #e8d9c0;
      --ink-mid: #a09070;
      --accent:  #c4621a;
      --gold:    #b8860b;
      --rule:    #3a2c1a;
    }

    html { font-size: 16px; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .hub {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .hub-wordmark {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin-bottom: 0.5rem;
    }

    .hub-title {
      font-size: 2.8rem;
      color: var(--accent);
      font-style: italic;
      line-height: 1;
      margin-bottom: 0.4rem;
    }

    .hub-rule {
      width: 3rem;
      border: none;
      border-top: 1px solid var(--rule);
      margin: 1.25rem auto;
    }

    .hub-byline {
      font-size: 0.82rem;
      color: var(--ink-mid);
      font-style: italic;
      margin-bottom: 3rem;
    }

    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .game-card {
      display: block;
      border: 1px solid var(--rule);
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      text-align: left;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .game-card:hover {
      border-color: var(--accent);
      background: rgba(196,98,26,0.05);
    }

    .game-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin-bottom: 0.3rem;
    }

    .game-name {
      font-size: 1.4rem;
      color: var(--accent);
      font-style: italic;
      line-height: 1.2;
      margin-bottom: 0.25rem;
    }

    .game-tagline {
      font-size: 0.85rem;
      color: var(--ink-mid);
    }

    .game-card.coming-soon {
      opacity: 0.4;
      pointer-events: none;
      cursor: default;
    }
    .game-card.coming-soon .game-label::after {
      content: ' — Coming Soon';
    }

    .hub-footer {
      font-size: 0.72rem;
      color: var(--ink-mid);
      font-style: italic;
    }
    .hub-footer a {
      color: var(--ink-mid);
      text-decoration: none;
    }
    .hub-footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="hub">

    <p class="hub-wordmark">silentbardgames.com</p>
    <h1 class="hub-title">OneSRD</h1>
    <hr class="hub-rule">
    <p class="hub-byline">System Reference Documents by The Silent Bard</p>

    <div class="game-grid">

      <a href="/L1/" class="game-card">
        <p class="game-label">Fantasy RPG</p>
        <p class="game-name">Level One</p>
        <p class="game-tagline">No classes. Any dice. Stories first.</p>
      </a>

      <div class="game-card coming-soon">
        <p class="game-label">Sci-Fi RPG</p>
        <p class="game-name">Future Title</p>
        <p class="game-tagline">Coming when it's done.</p>
      </div>

    </div>

    <p class="hub-footer">
      &copy; The Silent Bard &nbsp;&middot;&nbsp;
      <a href="https://silentbardgames.com">silentbardgames.com</a>
    </p>

  </div>
</body>
</html>
